name: Tennis Kalshi Capture Conductor

# Continuous prospective capture of the Kalshi tennis universe (quotes, books, global trade tape,
# settlements, candles). One runner loops a capture pass every INTERVAL seconds for MINUTES minutes,
# publishing to the orphan `tennis-data` branch after every pass, then DISPATCHES ITS OWN SUCCESSOR.
# Since the 2026-09-11 migration to the standalone repository this workflow lives on the DEFAULT branch,
# so the `schedule:` cron below is the primary driver and the self-dispatch is the belt-and-braces
# continuation that keeps the 10-minute cadence unbroken between cron ticks. Either alone is sufficient;
# `concurrency` guarantees only one conductor runs at a time. Stop the chain by disabling this workflow.
# The hand-off (scripts/ci/conductor_chain.py) does not dispatch when a run is already queued (normally the cron
# tick), because a second pending run would cancel the first: that race made ~every cron tick a CANCELLED run.
#
# Evidence paths on `tennis-data` keep the historical `tennis-edge-finder/` prefix (--dest-prefix): that is
# what allowed every pre-migration commit to migrate with its ORIGINAL SHA. Do not "tidy" it.
# Read-only public GETs; no secrets beyond GITHUB_TOKEN (contents+actions write for publish/chain).

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'how long this conductor loops'
        required: false
        default: '340'
      interval:
        description: 'seconds between capture passes'
        required: false
        default: '600'
      chain:
        description: 'dispatch a successor run when finished (true/false)'
        required: false
        default: 'true'
  push:
    branches: ['main']
    paths: ['.capture-trigger']
  schedule:
    - cron: '3 */5 * * *'   # a conductor loops ~5h40m; this restarts one every 5h even if a self-dispatch is lost

permissions:
  contents: write
  actions: write

concurrency:
  group: tennis-capture-conductor
  cancel-in-progress: false

jobs:
  conduct:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Record job start (the loop budgets against timeout-minutes, see scripts/ci/conductor_clock.sh)
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore the artifacts the external scan prices from
        run: |
          # Wave 4. The scan needs the rating registry and the walk-forward states; both are published by
          # tennis-run and are far cheaper to fetch than to rebuild inside a ten-minute loop.
          python3 -m pip install --quiet pandas pyarrow
          # Blobless + sparse (2026-10-05): fetching the whole 8 GB evidence tip took ~5.5 min here; only these
          # four files are read. The fetch also marks origin as a promisor, so the per-pass `git show` below
          # downloads one blob instead of the tree.
          python3 scripts/ci/pull_data_branch.py --paths processed/ratings_ATP.json processed/ratings_WTA.json \
            processed/asof/asof_ATP.json.gz processed/asof/asof_WTA.json.gz || echo "::warning::could not restore rating artifacts"
          ls -la data/processed data/processed/asof || true
      - name: Loop capture + publish
        id: loop
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          MINUTES="${{ github.event.inputs.minutes || '340' }}"
          INTERVAL="${{ github.event.inputs.interval || '600' }}"
          # END = min(loop start + MINUTES, job start + timeout-minutes - 10); a pass starts only if the longest
          # pass so far still fits, so a normal conductor ends by itself instead of being cancelled by the timeout
          source scripts/ci/conductor_clock.sh
          END=$(conductor_end "$(date +%s)" "$MINUTES" "$JOB_T0" 355 10)
          PASS=0
          LONGEST=0
          # one JSON line per pass; the final verdict step judges the conductor from it (scripts/ci/run_state.py)
          PASS_LOG="$RUNNER_TEMP/capture_passes.jsonl"; : > "$PASS_LOG"
          # step timer (2026-10-07): wall-clock seconds per step go into a pass record (scripts/ci/pass_record.py) that is
          # published with the next capture publish -- the evidence TENNIS-5 background_capture_health reads
          ms() { date +%s%3N; }
          PREV_START_MS=0
          while conductor_should_start "$(date +%s)" "$END" "$LONGEST"; do
            T0=$(date +%s); START_MS=$(ms); STEPS=""
            step() { local t=$(ms); STEPS="$STEPS $1=$(( t - LAST_MS ))e-3"; LAST_MS=$t; }
            LAST_MS=$START_MS
            git fetch --filter=blob:none --depth=1 origin tennis-data || true; step fetch
            mkdir -p data/kalshi/capture
            git show origin/tennis-data:tennis-edge-finder/data/kalshi/capture/state.json > data/kalshi/capture/state.json 2>/dev/null || echo '{}' > data/kalshi/capture/state.json
            # continue today's dislocation-ledger chain from the branch instead of replacing it (scripts/ci/restore_day_files.py)
            python3 scripts/ci/restore_day_files.py || echo "::warning::could not restore today's dislocation ledger"; step restore
            CAP_RC=0; python3 scripts/kalshi/capture_tennis.py || CAP_RC=$?; step capture
            [ "$CAP_RC" -ne 0 ] && echo "::warning::capture pass $PASS returned $CAP_RC (2 = partial, otherwise failed)"
            # daily taxonomy refresh (catalogue + events + markets + historical, no price history)
            LAST_DISC=$(git ls-tree --name-only origin/tennis-data tennis-edge-finder/data/kalshi/discovery/ 2>/dev/null | sort | tail -1 | grep -oE '[0-9]{8}T' | tr -d T || echo 0)
            if [ "$(date -u +%Y%m%d)" != "$LAST_DISC" ] && [ $PASS -eq 0 ]; then
              python3 scripts/kalshi/discover_tennis.py --skip-phase2 || echo "::warning::daily discovery incomplete"
              python3 scripts/ci/publish_branch.py --branch tennis-data --src data/kalshi/discovery --message "kalshi tennis daily discovery $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || true
              rm -rf data/kalshi/discovery
            fi
            step discovery
            PUB_RC=0; python3 scripts/ci/publish_branch.py --branch tennis-data --src data/kalshi/capture --message "kalshi tennis capture $(date -u +'%Y-%m-%dT%H:%M:%SZ') (conductor pass $PASS)" || PUB_RC=$?
            # the previous passes' timing records (a sibling of capture/: readers take capture/'s newest subdirectory as today)
            [ -d data/kalshi/capture_passes ] && { python3 scripts/ci/publish_branch.py --branch tennis-data --src data/kalshi/capture_passes --message "capture pass records $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || true; }
            step capture_publish
            [ "$PUB_RC" -ne 0 ] && echo "::warning::publish failed on pass $PASS (exit $PUB_RC)"
            # Wave 4: an independent venue against the same board, BEFORE the capture files are cleaned
            # up, since the scan reads the quotes this pass just wrote.
            SCAN_RC=0; python3 scripts/external/capture_and_scan.py || SCAN_RC=$?; step external_scan
            [ "$SCAN_RC" -ne 0 ] && echo "::warning::external scan failed on pass $PASS (exit $SCAN_RC)"
            SCAN_PUB_RC=0; python3 scripts/ci/publish_branch.py --branch tennis-data --src data/research/external --message "external market scan $(date -u +'%Y-%m-%dT%H:%M:%SZ') (pass $PASS)" || SCAN_PUB_RC=$?; step external_publish
            [ "$SCAN_PUB_RC" -ne 0 ] && echo "::warning::external publish failed on pass $PASS (exit $SCAN_PUB_RC)"
            echo "{\"pass\":$PASS,\"capture_rc\":$CAP_RC,\"publish_rc\":$PUB_RC,\"scan_rc\":$SCAN_RC,\"scan_publish_rc\":$SCAN_PUB_RC}" >> "$PASS_LOG"
            rm -rf data/research/external/raw/*
            # per-pass market shards are on the branch once their publish succeeded; keeping them would make every later
            # publish re-read them (only the dislocation day file is a continuation and stays)
            [ "$SCAN_PUB_RC" -eq 0 ] && find data/research/external/market -name '*.*Z.jsonl' -delete 2>/dev/null
            rm -rf data/kalshi/capture/2*; find data/kalshi/capture -size +95M -delete
            step cleanup
            ELAPSED=$(( $(date +%s) - T0 ))
            [ "$ELAPSED" -gt "$LONGEST" ] && LONGEST=$ELAPSED
            # start-to-start cadence: sleep INTERVAL minus this pass's work (never negative, never past END); a pass that
            # overran starts the next one immediately and the overrun is recorded -- passes never overlap
            SLEEP=$(conductor_sleep "$(date +%s)" "$END" "$INTERVAL" "$ELAPSED")
            python3 scripts/ci/pass_record.py --out data/kalshi/capture_passes --pass "$PASS" --run-id "$GITHUB_RUN_ID" \
              --start-ms "$START_MS" --prev-start-ms "$PREV_START_MS" --interval "$INTERVAL" --sleep "$SLEEP" $STEPS || true
            PREV_START_MS=$START_MS
            PASS=$((PASS+1))
            [ "$SLEEP" -gt 0 ] && sleep "$SLEEP"
          done
          # the last pass record has no later capture publish to ride on
          python3 scripts/ci/publish_branch.py --branch tennis-data --src data/kalshi/capture_passes --message "capture pass records $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || true
          echo "conductor finished after $PASS passes (longest pass ${LONGEST}s, $(( END - $(date +%s) ))s of budget left)"
          echo "capture conductor: $PASS passes, longest ${LONGEST}s, ended within its budget" >> "$GITHUB_STEP_SUMMARY"
      - name: Hand off to the successor (dispatch one unless a run is already queued)
        # schedule-started conductors continue the chain too: with the hand-off below, the queued cron tick is
        # usually the successor, so it must be able to hand off in turn (as the first-ball conductor already does)
        if: always() && (github.event.inputs.chain == 'true' || github.event_name == 'push' || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/conductor_chain.py --workflow tennis-capture.yml --ref "${{ github.ref_name }}" \
            --inputs '{"minutes":"340","interval":"600","chain":"true"}'
      - name: Conductor verdict (the single enforcement step; FAILED only when no pass captured and published)
        # after the hand-off, so a failing conductor still passes the chain on: the successor is the retry
        if: always() && steps.loop.outcome == 'success'
        run: python3 scripts/ci/run_state.py capture --pass-log "$RUNNER_TEMP/capture_passes.jsonl"
