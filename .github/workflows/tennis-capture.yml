name: Tennis Kalshi Capture Conductor

# Continuous prospective capture of the Kalshi tennis universe (quotes, books, global trade tape,
# settlements, candles). One runner loops a capture pass every INTERVAL seconds for MINUTES minutes,
# publishing to the orphan `tennis-data` branch after every pass, then DISPATCHES ITS OWN SUCCESSOR.
# Since the 2026-09-11 migration to the standalone repository this workflow lives on the DEFAULT branch,
# so the `schedule:` cron below is the primary driver and the self-dispatch is the belt-and-braces
# continuation that keeps the 10-minute cadence unbroken between cron ticks. Either alone is sufficient;
# `concurrency` guarantees only one conductor runs at a time. Stop the chain by disabling this workflow.
#
# Evidence paths on `tennis-data` keep the historical `tennis-edge-finder/` prefix (--dest-prefix): that is
# what allowed every pre-migration commit to migrate with its ORIGINAL SHA. Do not "tidy" it.
# Read-only public GETs; no secrets beyond GITHUB_TOKEN (contents+actions write for publish/chain).

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'how long this conductor loops'
        required: false
        default: '340'
      interval:
        description: 'seconds between capture passes'
        required: false
        default: '600'
      chain:
        description: 'dispatch a successor run when finished (true/false)'
        required: false
        default: 'true'
  push:
    branches: ['main']
    paths: ['.capture-trigger']
  schedule:
    - cron: '3 */5 * * *'   # a conductor loops ~5h40m; this restarts one every 5h even if a self-dispatch is lost

permissions:
  contents: write
  actions: write

concurrency:
  group: tennis-capture-conductor
  cancel-in-progress: false

jobs:
  conduct:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore the artifacts the external scan prices from
        run: |
          # Wave 4. The scan needs the rating registry and the walk-forward states; both are published by
          # tennis-run and are far cheaper to fetch than to rebuild inside a ten-minute loop.
          python3 -m pip install --quiet pandas pyarrow
          git fetch --depth=1 origin tennis-data || true
          mkdir -p data/processed/asof
          for f in ratings_ATP.json ratings_WTA.json; do
            git show origin/tennis-data:tennis-edge-finder/data/processed/$f > data/processed/$f 2>/dev/null || echo "::warning::no $f on tennis-data"
          done
          for f in asof_ATP.json.gz asof_WTA.json.gz; do
            git show origin/tennis-data:tennis-edge-finder/data/processed/asof/$f > data/processed/asof/$f 2>/dev/null || echo "::warning::no $f on tennis-data"
          done
          ls -la data/processed data/processed/asof || true
      - name: Loop capture + publish
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          MINUTES="${{ github.event.inputs.minutes || '340' }}"
          INTERVAL="${{ github.event.inputs.interval || '600' }}"
          END=$(( $(date +%s) + MINUTES * 60 ))
          PASS=0
          while [ $(date +%s) -lt $END ]; do
            T0=$(date +%s)
            git fetch --depth=1 origin tennis-data || true
            mkdir -p data/kalshi/capture
            git show origin/tennis-data:tennis-edge-finder/data/kalshi/capture/state.json > data/kalshi/capture/state.json 2>/dev/null || echo '{}' > data/kalshi/capture/state.json
            python3 scripts/kalshi/capture_tennis.py || echo "::warning::capture pass $PASS returned non-zero (partial)"
            # daily taxonomy refresh (catalogue + events + markets + historical, no price history)
            LAST_DISC=$(git ls-tree --name-only origin/tennis-data tennis-edge-finder/data/kalshi/discovery/ 2>/dev/null | sort | tail -1 | grep -oE '[0-9]{8}T' | tr -d T || echo 0)
            if [ "$(date -u +%Y%m%d)" != "$LAST_DISC" ] && [ $PASS -eq 0 ]; then
              python3 scripts/kalshi/discover_tennis.py --skip-phase2 || echo "::warning::daily discovery incomplete"
              python3 scripts/ci/publish_branch.py --branch tennis-data --src data/kalshi/discovery --message "kalshi tennis daily discovery $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || true
              rm -rf data/kalshi/discovery
            fi
            python3 scripts/ci/publish_branch.py --branch tennis-data --src data/kalshi/capture --message "kalshi tennis capture $(date -u +'%Y-%m-%dT%H:%M:%SZ') (conductor pass $PASS)" || echo "::warning::publish failed on pass $PASS"
            # Wave 4: an independent venue against the same board, BEFORE the capture files are cleaned
            # up, since the scan reads the quotes this pass just wrote.
            python3 scripts/external/capture_and_scan.py || echo "::warning::external scan failed on pass $PASS"
            python3 scripts/ci/publish_branch.py --branch tennis-data --src data/research/external --message "external market scan $(date -u +'%Y-%m-%dT%H:%M:%SZ') (pass $PASS)" || echo "::warning::external publish failed on pass $PASS"
            rm -rf data/research/external/raw/*
            rm -rf data/kalshi/capture/2*; find data/kalshi/capture -size +95M -delete
            PASS=$((PASS+1))
            ELAPSED=$(( $(date +%s) - T0 ))
            SLEEP=$(( INTERVAL - ELAPSED )); [ $SLEEP -gt 0 ] && sleep $SLEEP
          done
          echo "conductor finished after $PASS passes"
      - name: Dispatch successor
        if: always() && (github.event.inputs.chain == 'true' || github.event_name == 'push')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/tennis-capture.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}","inputs":{"minutes":"340","interval":"600","chain":"true"}}' -w "\nHTTP %{http_code}\n"
