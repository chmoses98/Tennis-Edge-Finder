name: tests

on:
  pull_request:
  push:
    branches: ['main']

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install --quiet -e . pytest
      - name: Test
        run: python -m pytest -q tests
