name: Tennis Bootstrap (sources + Kalshi tennis discovery)

# The development sandbox cannot reach github.com raw content, tennis-data.co.uk or the Kalshi API.
# This runner can. Two independent jobs fetch raw snapshots and publish them to the orphan
# `tennis-data` branch (never to main / code branches). Read-only public GETs only; no secrets.

on:
  # workflow_dispatch is only registered for workflows on the default branch; a push to the
  # tennis branch that touches the trigger file runs this workflow FROM that branch.
  push:
    branches: ['main']
    paths: ['.bootstrap-trigger']
  schedule:
    - cron: '40 5 * * *'   # daily source refresh: fork snapshots go stale and TENNIS-14 fails on them
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: 'Kalshi phase-2 (candles/trades) wall budget in minutes'
        required: false
        default: '200'
      skip_mcp:
        description: 'skip Match Charting Project clone (true/false)'
        required: false
        default: 'false'
      espn_since:
        description: 'earliest date for the ESPN results backfill (YYYY-MM-DD)'
        required: false
        default: '2026-04-01'

permissions:
  contents: write

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Acquire Sackmann snapshots
        id: acquire
        continue-on-error: true
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q "jobs=kalshi" .bootstrap-trigger 2>/dev/null; then echo "trigger requests kalshi only; skipping sources"; exit 0; fi
          EXTRA=""
          if [ "${{ github.event.inputs.skip_mcp }}" = "true" ]; then EXTRA="--skip-mcp"; fi
          python3 scripts/data/bootstrap_sources.py --only sackmann --out data/sources $EXTRA
      - name: Publish Sackmann snapshots
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/ci/publish_branch.py --branch tennis-data --src data/sources --message "tennis sources bootstrap (sackmann) $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          rm -rf data/sources
      - name: Acquire current ESPN results
        id: acquire_espn
        continue-on-error: true
        timeout-minutes: 25
        run: |
          if grep -q "jobs=kalshi" .bootstrap-trigger 2>/dev/null; then echo "trigger requests kalshi only; skipping espn"; exit 0; fi
          # The Sackmann forks are frozen (upstream gone) and the mirror lags by days, so ESPN's public
          # scoreboard is the only reachable feed carrying CURRENT results for both tours. Results only:
          # no serve statistics, no surface, ESPN-local player ids bound by the name crosswalk.
          # the sources job installs nothing by default (the Sackmann fetcher is stdlib-only) and this
          # script needs pandas; without it the step dies on import and continue-on-error reports
          # SUCCESS, which is how two runs published nothing while looking green
          python3 -m pip install --quiet pandas
          python3 scripts/data/fetch_espn_results.py --since "${{ github.event.inputs.espn_since || '2026-04-01' }}"
          ls -d data/sources/espn/* >/dev/null 2>&1 || { echo "::error::ESPN fetch produced no output"; exit 1; }
      - name: Probe external odds sources
        id: odds_probe
        continue-on-error: true
        timeout-minutes: 12
        run: |
          # Wave 4 Phase 0. robots.txt is fetched FIRST for every host and a disallowed path is not
          # requested at all; a source we may not use is not a source.
          python3 scripts/external/probe_odds_sources.py
          python3 scripts/external/probe_odds_round2.py
      - name: Publish external odds probe
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/ci/publish_branch.py --branch tennis-data --src data/sources/external_odds_probe --message "external odds probe $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || true
      - name: Probe for a current serve-statistics source
        id: serve_probe
        continue-on-error: true
        timeout-minutes: 10
        run: |
          # BOUNDED (Wave 3 Phase 18): the women's serve statistics stop at 2026-04-27 and TENNIS-14
          # fails on that. This checks the few remaining candidates and records what each returned.
          GITHUB_TOKEN="${{ github.token }}" python3 scripts/data/probe_serve_sources.py
      - name: Publish serve-source probe
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/ci/publish_branch.py --branch tennis-data --src data/sources/serve_probe --message "serve-source probe $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || true
      - name: Publish ESPN results
        if: always()
        # a green step that published nothing is worse than a red one, so say so out loud
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/ci/publish_branch.py --branch tennis-data --src data/sources/espn --message "espn current results $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || true
      - name: Acquire tennis-data.co.uk (+ mirrors)
        id: acquire_td
        continue-on-error: true
        timeout-minutes: 30
        run: |
          if grep -q "jobs=kalshi" .bootstrap-trigger 2>/dev/null; then exit 0; fi
          sleep 2
          python3 scripts/data/bootstrap_sources.py --only tennisdata --out data/sources
      - name: Publish tennis-data snapshots
        run: |
          python3 scripts/ci/publish_branch.py --branch tennis-data --src data/sources --message "tennis sources bootstrap (tennis-data + mirrors) $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      - name: Report partial acquisition
        if: steps.acquire.outcome != 'success'
        run: echo "::warning::source acquisition reported failures (see manifest.json); data published for inspection"

  kalshi:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Discover Kalshi tennis universe (publishes incrementally)
        id: discover
        continue-on-error: true
        env:
          TENNIS_PUBLISH: "1"
        run: |
          if grep -q "jobs=sources" .bootstrap-trigger 2>/dev/null; then echo "trigger requests sources only; skipping kalshi"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/kalshi/discover_tennis.py --budget-minutes "${{ github.event.inputs.budget_minutes || '200' }}"
      - name: Final publish
        run: |
          python3 scripts/ci/publish_branch.py --branch tennis-data --src data/kalshi --message "kalshi tennis discovery final publish $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      - name: Fail if discovery was incomplete
        if: steps.discover.outcome != 'success'
        run: |
          echo "::warning::discovery step exited non-zero (partial universe or error); data was still published"
          exit 1
