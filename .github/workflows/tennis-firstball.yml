name: First-Ball Truth Conductor

# Phase 3 of the first-ball wave: continuous, adaptive polling for the ACTUAL start of every mapped
# tennis match, so that "this observation existed before the first ball" becomes a checkable claim
# instead of an assumption about a scheduled time.
#
# Shape mirrors the capture conductor deliberately: one runner loops for ~5h40m, publishes its
# append-only store to `tennis-data` after every segment, then dispatches its own successor; cron is the
# backstop if a dispatch is ever lost, and `concurrency` guarantees at most one running plus one pending.
# The hand-off (scripts/ci/conductor_chain.py) does not dispatch when a run is already queued (normally the cron
# tick), because a second pending run would cancel the first: that race made ~every cron tick a CANCELLED run.
#
# The watchlist comes from the LIVE capture board (latest full capture snapshot + later passes), unioned with
# the daily discovery snapshot. Until 2026-10-02 it came from discovery alone, loaded once per job, so any
# market Kalshi listed after the daily snapshot was never watched (six WTA Beijing matches were first seen
# finished). After every segment the window planner (scripts/firstball/plan_windows.py) reconciles start times
# and dispatches `TENNIS assisted slate` ~45 and ~10 minutes before the earliest credible first ball of the next
# ATP/WTA window (a full RUN TENNIS first when the producer rows are over 3 h old).
#
# Cadence is decided by the WATCHLIST, not by this file: 60 s when a match is near its expected start or
# is an ITF/Challenger event whose nominal time is not a start time at all, 300 s when something is hours
# away, 900 s otherwise. Request volume scales with the number of SOURCES, not matches, because every
# feed is a day-level or live-level board.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'how long this conductor loops'
        required: false
        default: '340'
      segment:
        description: 'minutes of polling between publishes'
        required: false
        default: '10'
      sources:
        description: 'comma-separated adapter ids'
        required: false
        default: 'espn_atp,espn_wta'
      chain:
        description: 'dispatch a successor when finished (true/false)'
        required: false
        default: 'true'
  push:
    branches: ['main']
    paths: ['.firstball-trigger']
  schedule:
    - cron: '17 */5 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: tennis-firstball-conductor
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Record job start (the loop budgets against timeout-minutes, see scripts/ci/conductor_clock.sh)
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Poll for first ball, plan windows, publish after every segment
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_REF: ${{ github.ref_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          MINUTES="${{ github.event.inputs.minutes || '340' }}"
          SEGMENT="${{ github.event.inputs.segment || '10' }}"
          SOURCES="${{ github.event.inputs.sources || 'espn_atp,espn_wta' }}"
          git fetch --depth=1 origin tennis-data || true
          # the append-only store and the newest discovery snapshot both live on the data branch
          git archive origin/tennis-data tennis-edge-finder/data/firstball/store | tar -x --strip-components=1 || true
          LATEST=$(git ls-tree --name-only origin/tennis-data tennis-edge-finder/data/kalshi/discovery/ 2>/dev/null | sort | tail -1)
          if [ -n "$LATEST" ]; then
            git archive origin/tennis-data "$LATEST" | tar -x --strip-components=1 || true
          fi
          ls -d data/kalshi/discovery/* 2>/dev/null | tail -2 || echo "::warning::no discovery snapshot unpacked"
          # END = min(loop start + MINUTES, job start + timeout-minutes - 10); a segment starts only if the longest
          # segment so far still fits, so a normal conductor ends by itself instead of being cancelled by the timeout
          source scripts/ci/conductor_clock.sh
          END=$(conductor_end "$(date +%s)" "$MINUTES" "$JOB_T0" 355 10)
          SEG=0
          LONGEST=0
          while conductor_should_start "$(date +%s)" "$END" "$LONGEST"; do
            S0=$(date +%s)
            # Refresh the LIVE open universe before every segment. A discovery snapshot can be many hours
            # old and still list matches that have since been played out; the capture conductor
            # republishes the open universe every ten minutes, so its freshest pass is the real one.
            git fetch --depth=1 origin tennis-data || true
            rm -rf data/kalshi/capture; mkdir -p data/kalshi/capture
            # enough passes to reach back to the latest FULL snapshot (one every ~75 min): the live board is that
            # snapshot plus every changed pass after it
            for f in $(for d in "$(date -u -d yesterday +%Y-%m-%d)" "$(date -u +%Y-%m-%d)"; do \
                         git ls-tree -r --name-only origin/tennis-data "tennis-edge-finder/data/kalshi/capture/$d/" 2>/dev/null; \
                       done | grep '\.quotes\.jsonl\.gz$' | sort -t/ -k6 | tail -24); do
              git archive origin/tennis-data "$f" | tar -x --strip-components=1 || true
            done
            ls data/kalshi/capture/*/*.quotes.jsonl.gz 2>/dev/null | tail -1 || echo "::warning::no fresh capture pass for segment $SEG"
            rm -rf data/research/assisted_slates; mkdir -p data/research
            for f in latest.json slate_runs.jsonl; do
              git archive origin/tennis-data "tennis-edge-finder/data/research/assisted_slates/$f" 2>/dev/null | tar -x --strip-components=1 || true
            done
            python3 scripts/firstball/poll_first_ball.py --minutes "$SEGMENT" --sources "$SOURCES" \
              || echo "::warning::poll segment $SEG returned non-zero (partial)"
            python3 scripts/ci/publish_branch.py --branch tennis-data --src data/firstball/store \
              --message "first-ball truth $(date -u +'%Y-%m-%dT%H:%M:%SZ') (segment $SEG)" \
              || echo "::warning::publish failed on segment $SEG"
            # plan the next ATP/WTA window from live start evidence; dispatch the assisted refresh when it is due.
            # AFTER the publish above, so a dispatched slate fetches the observations that triggered it.
            python3 scripts/firstball/plan_windows.py --dispatch \
              || echo "::warning::window planner failed on segment $SEG (polling continues)"
            python3 scripts/ci/publish_branch.py --branch tennis-data --src data/firstball/store \
              --message "first-ball window plan $(date -u +'%Y-%m-%dT%H:%M:%SZ') (segment $SEG)" \
              || echo "::warning::plan publish failed on segment $SEG"
            SEG=$((SEG+1))
            ELAPSED=$(( $(date +%s) - S0 ))
            [ "$ELAPSED" -gt "$LONGEST" ] && LONGEST=$ELAPSED
          done
          echo "first-ball conductor finished after $SEG segments (longest ${LONGEST}s, $(( END - $(date +%s) ))s of budget left)"
          echo "first-ball conductor: $SEG segments, longest ${LONGEST}s, ended within its budget" >> "$GITHUB_STEP_SUMMARY"
      - name: Hand off to the successor (dispatch one unless a run is already queued)
        if: always() && (github.event.inputs.chain == 'true' || github.event_name == 'push' || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/conductor_chain.py --workflow tennis-firstball.yml --ref "${{ github.ref_name }}" \
            --inputs '{"minutes":"340","segment":"10","chain":"true"}'
