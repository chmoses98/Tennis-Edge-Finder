name: RUN TENNIS (projections + settlement)

# Rebuilds the canonical table from the latest source snapshots, refits rating states, prices every open
# projectable Kalshi tennis market, appends to the immutable ledger, settles what has settled, and publishes
# data/research (ledger, projections, settlements, health) to the `tennis-data` branch.
# Research only: no order surface exists in this repository.

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths: ['.run-trigger']
  schedule:
    - cron: '25 */6 * * *'   # projections + settlement four times a day

permissions:
  contents: write

concurrency:
  group: tennis-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python3 -m pip install --quiet numpy pandas scipy scikit-learn pyarrow openpyxl xlrd
      - name: Pull snapshots, capture and existing ledger from tennis-data
        run: |
          git fetch --depth=1 origin tennis-data
          # the evidence tree keeps its historical `tennis-edge-finder/` prefix (see MIGRATION_AUDIT.md);
          # --strip-components=1 lands it at ./data/ where the standalone code expects it
          git archive origin/tennis-data tennis-edge-finder/data | tar -x --strip-components=1
          ls data
      - name: Build canonical table and rating states
        run: |
          PYTHONPATH=. python3 tennis_edge/data/build.py | tail -5
          PYTHONPATH=. python3 -m tennis_edge.models.state --tour ATP
          PYTHONPATH=. python3 -m tennis_edge.models.state --tour WTA
      - name: Project, settle, health
        run: |
          PYTHONPATH=. python3 scripts/run_tennis.py | tail -20
          # FROZEN research producers, run live (no model is fitted or changed here). Each writes an
          # append-only store, a heartbeat, and -- on its first production run only -- the write-once
          # experiment-start records. A failure is loud (::error::) and shows up as PRODUCER_NOT_RUNNING
          # in TENNIS-15, but never blocks settlement or publication.
          if ! PYTHONPATH=. python3 scripts/ops/shadow_board.py --out data/research/shadow_board/SHADOW_BOARD.md > shadow.log 2>&1; then
            echo "::error::frozen shadow-board producer failed"
          fi
          tail -20 shadow.log
          if ! PYTHONPATH=. python3 scripts/ops/model4_board.py > model4.log 2>&1; then
            echo "::error::frozen Model 4 producer failed"
          fi
          tail -20 model4.log
          PYTHONPATH=. python3 scripts/ops/settle_ledger.py | tail -10
          # prospective confirmation: score the FROZEN candidates on post-freeze evidence (derived,
          # append-only layer; never writes a candidate definition). A harvest failure cannot block
          # settlement or publication, and it cannot stay invisible either (see below).
          if ! EVIDENCE_SOURCE_LABEL="tennis-data@$(git rev-parse --short origin/tennis-data)" \
               PYTHONPATH=. python3 scripts/research/harvest_candidate_evidence.py --data-root data \
               --evidence-out data/research/candidate_evidence \
               --report-out data/research/candidate_confirmation > harvest.log 2>&1; then
            # never invisible: an error annotation, a recorded failure (TENNIS-15 then FAILS), and the next
            # run retries from the immutable inputs. Settlement and capture outputs still publish below.
            echo "::error::candidate evidence harvest failed -- TENNIS-15 will FAIL until a harvest succeeds"
            PYTHONPATH=. python3 scripts/research/harvest_candidate_evidence.py \
              --report-out data/research/candidate_confirmation \
              --record-failure "$(tail -c 1500 harvest.log)" || true
          fi
          tail -12 harvest.log
          # ChatGPT-assisted lane, BESIDE the frozen experiments (it reads their outputs and writes none of
          # them): the handicapping slate, then track start / canonical ledgers / settlement / scorecard.
          # A failure is loud and recorded (TENNIS-16 then FAILS); it never blocks settlement or publication.
          if ! PYTHONPATH=. python3 scripts/research/build_assisted_slate.py > slate.log 2>&1; then
            echo "::error::assisted slate build failed"
          fi
          tail -12 slate.log
          if ! PYTHONPATH=. python3 scripts/research/run_assisted_pipeline.py --write-track-start \
               --scorecard-out data/research/assisted_handicapping > assisted.log 2>&1; then
            echo "::error::assisted pipeline failed -- TENNIS-16 will FAIL until it succeeds"
          fi
          tail -12 assisted.log
          # Model-vs-market discrepancy audit: DIAGNOSTIC only (reads producer rows, settlements, the external scan and
          # first-ball truth; changes no model, candidate or experiment start). A failure warns and never blocks.
          if ! PYTHONPATH=. python3 scripts/research/discrepancy_audit.py --data-root data \
               --out data/research/model_market_discrepancy > discrepancy.log 2>&1; then
            echo "::warning::model-market discrepancy audit failed (diagnostic only)"
          fi
          tail -12 discrepancy.log
          PYTHONPATH=. python3 -c "from tennis_edge.health.gates import run_all; import json; json.dump([g.to_dict() for g in run_all()], open('data/research/health_latest.json','w'), indent=1, default=str)"
          cat data/research/health_latest.json | python3 -c "import json,sys; [print(g['gate'], g['status']) for g in json.load(sys.stdin)]"
      - name: App export (Edge Finder contract)
        # Edge Finder app payload -> data/app/latest, carried to tennis-data by the publish step below
        # (registry path tennis-edge-finder/data/app/latest). The exporter changes no production output.
        # On failure it writes health.json ONLY (export_failed, last-known-good payload left in place) and
        # exits 1; that failure is RECORDED here and RAISED after the research outputs have been published,
        # so a broken export can never block settlement/ledger/slate publication and can never be silent.
        run: |
          ACC=""
          if git ls-remote --exit-code --heads origin accounting-data >/dev/null 2>&1; then
            git fetch --depth=1 origin accounting-data
            rm -rf ../_accounting_data && mkdir -p ../_accounting_data
            git archive origin/accounting-data | tar -x -C ../_accounting_data
            ACC="--accounting-dir ../_accounting_data"
          fi
          if ! PYTHONPATH=. python3 scripts/app_export.py --data-root data --out data/app/latest $ACC \
               --commit-sha "$GITHUB_SHA" --workflow-run-id "$GITHUB_RUN_ID" > app_export.log 2>&1; then
            echo "::error::app export failed; health-only written, payload is last-known-good (job fails after publish)"
            echo "APP_EXPORT_FAILED=1" >> "$GITHUB_ENV"
          fi
          tail -8 app_export.log
      - name: Publish research outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/ci/publish_branch.py --branch tennis-data --src data/research --message "tennis run $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          # Edge Finder app payload (or its health-only failure record): same branch, data/app -> tennis-edge-finder/data/app
          python3 scripts/ci/publish_branch.py --branch tennis-data --src data/app --message "app export $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          # Wave 4: the walk-forward artifacts the live dislocation scan reads. Built here because this
          # is the job that has just refit the ratings, and published so a ten-minute capture job never
          # has to replay 1.6M matches to price a board.
          python3 scripts/research/build_asof_states.py || echo "::warning::asof build failed"
          python3 scripts/ci/publish_branch.py --branch tennis-data --src data/processed --message "tennis processed artifacts $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || true
      - name: Fail the job if the app export failed (after publish)
        if: env.APP_EXPORT_FAILED == '1'
        run: |
          echo "::error::app export failed earlier in this run; research outputs were published, app/latest carries health-only"
          exit 1
