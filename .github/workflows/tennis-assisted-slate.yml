name: TENNIS assisted slate

# Rebuilds the assisted handicapping slate (data/research/assisted_slates/latest.{json,md}) on demand, from
# the latest capture and the frozen producers' latest rows, and publishes it to `tennis-data`. RUN TENNIS
# also builds it every six hours; this is for "RUN TENNIS" moments between those runs. It selects nothing.
# The rating tables feed only the discrepancy layer's namesake and surface-sample checks (no model is run).
# First-ball observations feed start-time reconciliation (live status, ESPN's current time, court progression).
# The first-ball conductor's window planner dispatches this workflow ~45 and ~10 minutes before the earliest
# credible first ball of each ATP/WTA window.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tennis-assisted-slate
  cancel-in-progress: true

jobs:
  slate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pull the latest producer rows, capture and first-ball truth
        run: |
          git fetch --depth=1 --filter=blob:none origin tennis-data
          T=$(date -u +%F); Y=$(date -u -d yesterday +%F)
          for path in research/assisted_slates research/health_latest.json research/frozen_producers/heartbeats.jsonl \
                      research/assisted_decisions app/latest firstball/store/truths firstball/store/schedule \
                      "firstball/store/observations/$Y.jsonl" "firstball/store/observations/$T.jsonl" \
                      "kalshi/capture/$Y" "kalshi/capture/$T" \
                      "research/ledger/$Y.jsonl" "research/ledger/$T.jsonl" \
                      "research/frozen_producers/shadow_board/$Y.jsonl" "research/frozen_producers/shadow_board/$T.jsonl" \
                      "research/frozen_producers/model4/$Y.jsonl" "research/frozen_producers/model4/$T.jsonl" \
                      "research/external/dislocations/$Y.jsonl" "research/external/dislocations/$T.jsonl" \
                      research/settlements/SCORECARD.md research/candidate_confirmation \
                      processed/ratings_ATP.json processed/ratings_WTA.json; do
            # evidence keeps its historical prefix on the branch; --strip-components=1 lands it at ./data/
            if [ -n "$(git ls-tree origin/tennis-data "tennis-edge-finder/data/$path")" ]; then
              git archive origin/tennis-data "tennis-edge-finder/data/$path" | tar -x --strip-components=1
            else
              echo "::warning::$path is not on tennis-data"
            fi
          done
      - name: Fresh open-market snapshot (lifecycle + quote authority for this slate)
        # 2026-10-05: the slate's quotes came from the capture conductor's newest pass, routinely 30+ minutes old by
        # build time, so every slate row read STALE. A full open snapshot taken here (read-only, stateless, no
        # shared capture state touched) is overlaid on the board; markets absent from it are closed or settled.
        run: |
          python3 -m pip install --quiet pandas pyarrow || true
          PYTHONPATH=. python3 scripts/kalshi/snapshot_open_markets.py | tail -1 \
            || echo "::warning::open-market snapshot incomplete; the slate falls back to the incremental capture board"
      - name: Build the slate
        run: PYTHONPATH=. python3 scripts/research/build_assisted_slate.py
      - name: App export + research export (Edge Finder contract)
        # Same contract as RUN TENNIS: data/app/latest from the fresh slate. A failure writes health.json only,
        # is recorded here, and fails the job AFTER the slate has been published (never blocks it, never silent).
        run: |
          ACC=""
          if git ls-remote --exit-code --heads origin accounting-data >/dev/null 2>&1; then
            git fetch --depth=1 origin accounting-data
            rm -rf ../_accounting_data && mkdir -p ../_accounting_data
            git archive origin/accounting-data | tar -x -C ../_accounting_data
            ACC="--accounting-dir ../_accounting_data"
          fi
          if ! PYTHONPATH=. python3 scripts/app_export.py --data-root data --out data/app/latest $ACC \
               --commit-sha "$GITHUB_SHA" --workflow-run-id "$GITHUB_RUN_ID" > app_export.log 2>&1; then
            echo "::error::app export failed; health-only written, payload is last-known-good (job fails after publish)"
            echo "APP_EXPORT_FAILED=1" >> "$GITHUB_ENV"
            V1_FAILED=1
          fi
          tail -8 app_export.log
          # Edge Finder research graph (app/latest/explorer): its OWN command, run only after a good v1 export, with the
          # same --data-root/--out (its --now defaults to the v1 manifest's generated_at). A failure leaves the previous
          # explorer/ and the whole v1 payload untouched, is RECORDED here and RAISED after publication (never blocks it).
          if [ -n "${V1_FAILED:-}" ]; then
            echo "research export skipped: the v1 export failed (explorer/ left as last-known-good)" | tee research_export.log
          elif ! PYTHONPATH=. python3 scripts/research_export.py --data-root data --out data/app/latest \
               --commit-sha "$GITHUB_SHA" > research_export.log 2>&1; then
            echo "::error::research_export failed; explorer/ left as last-known-good (job fails after publish)"
            echo "RESEARCH_EXPORT_FAILED=1" >> "$GITHUB_ENV"
          fi
          tail -8 research_export.log
          { echo "### Edge Finder research export"; echo '```'; tail -12 research_export.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/ci/publish_branch.py --branch tennis-data --src data/research/assisted_slates \
            --message "assisted slate $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 scripts/ci/publish_branch.py --branch tennis-data --src data/kalshi/run_snapshots \
            --message "slate open-market snapshot $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || true
          python3 scripts/ci/publish_branch.py --branch tennis-data --src data/app \
            --message "app export $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      - name: Fail the job if the app export failed (after publish)
        if: env.APP_EXPORT_FAILED == '1'
        run: |
          echo "::error::app export failed earlier in this run; the slate was published, app/latest carries health-only"
          exit 1
      - name: Fail the job if the research export failed (after publish)
        if: env.RESEARCH_EXPORT_FAILED == '1'
        run: |
          echo "::error::research_export failed earlier in this run; outputs were published, explorer/ is last-known-good"
          exit 1
